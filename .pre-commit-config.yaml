# Pre-commit hooks encoding what docs/pre-commit.md describes.
# Install: `pipx install pre-commit && pre-commit install`
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: codespell
        name: codespell
        entry: python3 -m codespell_lib
        language: system
        pass_filenames: false
      - id: reuse-lint
        name: REUSE lint
        entry: reuse lint
        language: system
        pass_filenames: false
